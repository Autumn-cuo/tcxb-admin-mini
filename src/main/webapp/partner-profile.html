<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>同窗学伴 - 用户主页</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page-partner-profile">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-logo">🎓</div>
        <span class="brand-name">同窗学伴</span>
      </div>

      <nav class="nav">
        <a href="home.html" class="nav-item">首页</a>
        <a href="find-partner.html" class="nav-item">寻找学伴</a>
        <a href="my-partners.html" class="nav-item">我的学伴</a>
        <a href="report.html" class="nav-item">举报与黑名单</a>
        <a href="#" class="nav-item admin-entry">管理后台</a>
      </nav>

      <div class="user-box">
        <div class="avatar">👨</div>
        <div class="user-meta">
          <div class="user-name">张三</div>
          <div class="user-score">信誉分 4.8</div>
        </div>
        <div class="logout">↩</div>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="back-link" onclick="history.back()">← 返回上一页</div>

    <section class="profile-card">
      <div class="profile-top">
        <div class="profile-avatar" id="profileAvatar">👩‍🦳</div>
        <div class="profile-info">
          <h1 id="profileName">李四</h1>
          <p id="profileMajor">计算机科学与技术 · 大三年级 · 2021001235</p>
          <div class="score-line">★ <span id="profileScore">4.9</span> 信任分</div>
        </div>
      </div>

      <div class="section">
        <h3>个人简介</h3>
        <p id="profileIntro">认真学习，追求卓越，喜欢有计划地推进学习任务。</p>
      </div>

      <div class="section">
        <h3>在修课程</h3>
        <div class="tag-wrap" id="profileCourses"></div>
      </div>

      <div class="section">
        <h3>偏好时间</h3>
        <div class="tag-wrap" id="profileTimes"></div>
      </div>

      <div class="section">
        <h3>偏好地点</h3>
        <div class="tag-wrap" id="profilePlaces"></div>
      </div>

      <div class="section">
        <h3>学习风格</h3>
        <div class="tag-wrap" id="profileStyles"></div>
      </div>

      <div class="action-row">
        <button class="normal-btn" id="goReportBtn">举报该用户</button>
        <button class="danger-btn" id="blacklistBtn">加入黑名单</button>
      </div>
    </section>
  </main>

  <script src="common.js"></script>
  <script src="admin-auth.js"></script>
  <script src="partner-profile.js"></script>
  <script>
    bindLogout('.logout', 'login.html');
    bindAdminEntry('.admin-entry');
  </script>
</body>
</html>
