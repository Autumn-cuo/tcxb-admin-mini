<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>同窗学伴 - 登录</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page-login">
  <main class="login-page">
    <section class="login-wrap">
      <div class="logo-box">🎓</div>
      <h1 class="system-title">同窗学伴</h1>
      <p class="system-subtitle">找到合适的学习伙伴，共同进步</p>

      <div class="login-card">
        <div class="tab-bar">
          <button class="tab active" data-tab="login">登录</button>
          <button class="tab" data-tab="register">注册</button>
        </div>

          <section class="tab-content active" id="login-content">
              <div class="form-item">
                  <label>学校邮箱</label>
                  <input type="email" id="loginEmail" placeholder="your.email@university.edu" />
                  <div class="field-error" id="loginEmailError"></div>
              </div>

              <div class="form-item">
                  <label>密码</label>
                  <input type="password" id="loginPassword" placeholder="请输入密码" />
                  <div class="field-error" id="loginPasswordError"></div>
              </div>

              <div class="global-error hidden" id="loginGlobalError"></div>

              <div class="login-row">
                  <label class="remember">
                      <input type="checkbox" id="rememberMe" />
                      <span>记住我</span>
                  </label>
                  <a href="#" class="forget-link" id="forgetPasswordLink">忘记密码？</a>
              </div>

              <button class="primary-btn" id="loginBtn">登录</button>
              <button class="secondary-btn admin-entry" id="adminEntryBtn" type="button">管理员入口</button>
          </section>

<section class="tab-content" id="register-content">
    <div class="form-item">
        <label>姓名</label>
        <input type="text" id="registerName" placeholder="请输入姓名" />
        <div class="field-error" id="registerNameError"></div>
    </div>

    <div class="form-item">
        <label>学号</label>
        <input type="text" id="registerStudentNo" placeholder="请输入学号" />
        <div class="field-error" id="registerStudentNoError"></div>
    </div>


    <div class="form-item">
        <label>专业</label>
        <input type="text" id="registerMajor" placeholder="请输入专业" />
        <div class="field-error" id="registerMajorError"></div>
    </div>

    <div class="form-item">
        <label>学校邮箱</label>
        <input type="email" id="registerEmail" placeholder="your.email@university.edu" />
        <div class="field-error" id="registerEmailError"></div>
    </div>

    <div class="form-item">
        <label>密码</label>
        <input type="password" id="registerPassword" placeholder="请输入密码" />
        <div class="field-error" id="registerPasswordError"></div>
    </div>

    <div class="form-item">
        <label>确认密码</label>
        <input type="password" id="registerConfirmPassword" placeholder="请再次输入密码" />
        <div class="field-error" id="registerConfirmPasswordError"></div>
    </div>

    <div class="global-error hidden" id="registerGlobalError"></div>
    <div class="global-success hidden" id="registerSuccessMsg"></div>

    <button class="primary-btn" id="registerBtn">注册</button>
        </section>
      </div>

      <div class="footer-text">© 2026 同窗学伴. 让学习更有伴</div>
    </section>
  </main>

  <script src="common.js"></script>
  <script src="admin-auth.js"></script>
  <script src="login.js"></script>
</body>
</html>
